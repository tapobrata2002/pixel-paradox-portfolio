```svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#323232" />
  <g fill="#F5D547" transform="translate(60, 60)">
    <!-- Row 1, Col 1: Circle -->
    <circle cx="75" cy="75" r="50" />

    <!-- Row 1, Col 2: Square with rounded corners -->
    <rect x="150" y="25" width="100" height="100" rx="20" />

    <!-- Row 1-2, Col 3: Tall Vertical Rounded Rectangle -->
    <rect x="275" y="25" width="100" height="225" rx="20" />

    <!-- Row 2-3, Col 1: Tall Vertical Rounded Rectangle -->
    <rect x="25" y="150" width="100" height="225" rx="20" />

    <!-- Row 2, Col 2: Circle -->
    <circle cx="200" cy="200" r="50" />

    <!-- Row 3, Col 2: Square with rounded corners -->
    <rect x="150" y="275" width="100" height="100" rx="20" />

    <!-- Row 3, Col 3: Circle -->
    <circle cx="325" cy="325" r="50" />
  </g>
</svg>
